name: Quality gates

on:
  pull_request:
  push:
    branches: [main, audio-composite-support]

jobs:
  evidence-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install -e '.[dev]'
          transformers==5.12.1 diffusers==0.38.0 huggingface_hub==1.10.1
      - name: Config-consumption census is current
        run: python scripts/census.py --check
      - name: Declared 29+15 support denominator has no silent failures
        run: python scripts/coverage.py --check
      - name: Reviewed release examples are byte-current
        run: python scripts/generate_examples.py --check
