[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-unfolder"
version = "0.3.0"
description = "Unfold any HuggingFace transformer into an interactive architecture diagram, inline in Jupyter."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "model-unfolder contributors"}]
license = {text = "Apache-2.0"}
keywords = ["transformers", "visualization", "llm", "architecture", "jupyter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "transformers>=5.12.1,<6",
    "diffusers>=0.38,<1",
    "huggingface-hub>=1.10.1,<2",
]

[project.urls]
Homepage = "https://github.com/SoumilB7/unfold"
Repository = "https://github.com/SoumilB7/unfold"
"Bug Tracker" = "https://github.com/SoumilB7/unfold/issues"

[project.optional-dependencies]
hf = []
dev = ["pytest>=7", "pytest-xdist>=3,<4", "transformers>=4.40", "psutil>=5,<8"]

[tool.pytest.ini_options]
# Put the package root on sys.path so the importable top-level `test_support`
# package (shared fixtures, §16.1 fixture isolation) resolves from ANY test
# file, whether collected alone or in the grouped gate. No test module imports
# another test module (enforced by tests/test_isolation.py).
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["model_unfolder*"]

[tool.setuptools.package-data]
# Vocabulary YAML lives in per-domain subfolders (transformer/, diffusor/, ...),
# so glob recursively — new domains ship without touching this.
"model_unfolder.everchanging" = ["*.yaml", "*.yml", "**/*.yaml", "**/*.yml"]
