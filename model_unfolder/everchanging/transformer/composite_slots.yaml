# Declared component SLOTS of composite / seq2seq wrapper configs.
#
# Hugging Face's composite contract has TWO spellings: fields named *_config
# (walked unconditionally by evidence/sources._component_configs) and bare
# slot names whose value is a config dict carrying its own model_type
# (MusicGen: text_encoder / audio_encoder / decoder; the generic
# EncoderDecoderModel: encoder / decoder).  This vocabulary names the bare
# slots and the ROLE each plays, so parsers and the source walk can descend
# them WITHOUT guessing from arbitrary dicts — a slot only counts when its
# value actually declares a model_type (evidence, not the name alone).
#
# Roles:
#   main    - the primary generative stack (parsed as the model itself)
#   encoder - a conditioning encoder tower (drawn as a supporting panel)
#   codec   - an audio codec (tokenizer/detokenizer tower, census §4)
slots:
  - decoder=main
  - encoder=encoder
  - text_encoder=encoder
  - audio_encoder=codec

# Constructor field names that hold a decoder layer's CROSS-attention module.
# Used by the construction reader: a decoder-layer class that assigns one of
# these unconditionally in __init__ proves cross-attention on EVERY layer
# (MusicGen's encoder_attn) — the schedule comes from the code, never assumed.
cross_attn_fields:
  - encoder_attn
  - cross_attn
  - crossattention
  - cross_attention

# Config fields that DECLARE speech-synthesis components the diagram does not
# draw yet (audio plan U-E) — their presence must produce a STATED omission,
# never a silent one (VITS flows/duration/HiFiGAN; SpeechT5 pre/post-nets).
