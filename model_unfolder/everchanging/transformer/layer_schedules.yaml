# Per-layer TYPE-SCHEDULE spellings — the config keys that answer "which TYPE is
# layer i, along dimension D (mixer-kind / mask / FFN-kind)?".  The per-layer
# walk already resolves this for the canonical `layer_types` list and the MoE
# membership list; every family below just SPELLS the same schedule differently,
# so a new dialect is a row here, never new code.
#
# These are the CONFIG channel — the lower-confidence schedule consulted when the
# canonical `layer_types` list is absent (so the installed families that build
# `layer_types` stay byte-identical).  Each spelling normalizes into the SAME
# `layer_types` / `moe_layers` readers the working spellings flow through.
#
# Block style (`key:` + `- item`) and `raw=canonical` value pairs so the built-in
# loader works without PyYAML.

# --- FORM: value_list --------------------------------------------------------
# The field's value IS a per-layer list, one token per layer (int- or string-
# coded).  Each token is normalized through `value_aliases` below, then fitted
# to num_layers.
#   attn_type_list  (MiniMax-Text-01 / M1): [0,0,0,0,0,0,0,1, …] period-8 mixer
#   codes — 0 = lightning (linear) attention, 1 = full softmax attention.
value_list_fields:
  - attn_type_list

# --- FORM: pattern_tile ------------------------------------------------------
# A SHORT repeating pattern list, tiled to num_layers ((pattern * n)[:num_layers]).
#   block_types / _block_types / layers_block_type (recurrentgemma GRIFFIN):
#   ("recurrent","recurrent","attention") tiled across the stack — the
#   attention blocks are LOCAL (windowed) when the config declares a window.
pattern_tile_fields:
  - block_types
  - _block_types
  - layers_block_type

# --- FORM: nested_tile -------------------------------------------------------
# A NESTED [[pattern, repeat], …] spec: each (pattern, repeat) expands to
# `pattern` repeated `repeat` times, concatenated (gpt-neo attention_types =
# [[["global","local"], N]] → N×[global, local]).
nested_tile_fields:
  - attention_types

# --- FORM: dense_interval ----------------------------------------------------
# An INTEGER N: layer i is the `dense_interval_on` type iff i % N == 0, else the
# `dense_interval_off` type (Phi-3-small dense_attention_every_n_layers=2 →
# every 2nd layer dense, the rest blocksparse / compressed-sparse).
dense_interval_fields:
  - dense_attention_every_n_layers
dense_interval_on:
  - full_attention
dense_interval_off:
  - compressed_sparse_attention

# --- FORM: moe_comma_string --------------------------------------------------
# A comma-STRING of the MoE layer indices ("4,5,…,60"): parsed into the same
# membership set the `moe_layers` LIST reader already consumes (step3).
moe_comma_string_fields:
  - moe_layers_enum

# --- Canonical value map -----------------------------------------------------
# raw per-layer token (int or string, lowercased) = canonical `layer_types`
# value.  The canonical value then resolves through layer_types.yaml (mask) and
# `mixer_kinds` (below).  A token with no alias here is passed through unchanged
# (recognized by layer_types.yaml or reported as an unknown layer type).
value_aliases:
  - "0=lightning_attention"
  - "1=full_attention"
  - "global=full_attention"
  - "local=sliding_attention"

# --- Mixer kinds -------------------------------------------------------------
# canonical `layer_types` token = the safest mixer IR kind justified by that
# declaration. A schedule proves PLACEMENT and the declared type name; it does
# not prove the mixer's internal forward graph. Source-unresolved mixer types
# therefore use a dedicated ``declared_*`` opaque kind.
#   linear_attention  -> gated_delta : Qwen3-Next gated DeltaNet (existing path).
#   lightning_attention -> declared_lightning_mixer : placement/name only.
#   recurrent -> declared_recurrent_mixer            : placement/name only.
mixer_kinds:
  - "linear_attention=gated_delta"
  - "lightning_attention=declared_lightning_mixer"
  - "recurrent=declared_recurrent_mixer"
