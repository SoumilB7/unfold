# Mistral ORIGINAL-RELEASE ``params.json`` -> transformers spellings.
# This is a FORMAT dialect (keyed on the repo shipping params.json — layout
# evidence), not a per-model table: the keys are Mistral's own release
# vocabulary, mapped once for every model they publish in this format.
text:
  - dim=hidden_size
  - n_layers=num_hidden_layers
  - n_heads=num_attention_heads
  - n_kv_heads=num_key_value_heads
  - hidden_dim=intermediate_size
  - norm_eps=rms_norm_eps
  - head_dim=head_dim
  - rope_theta=rope_theta
  - vocab_size=vocab_size
  - max_position_embeddings=max_position_embeddings

# The nested ``vision_encoder`` dict -> vision_config (its inner spellings are
# already transformers-shaped where they matter; only the differing ones map).
vision:
  - num_channels=num_channels
  - image_size=image_size
  - patch_size=patch_size
  - hidden_size=hidden_size
  - intermediate_size=intermediate_size
  - num_hidden_layers=num_hidden_layers
  - num_attention_heads=num_attention_heads
  - rope_theta=rope_theta
  - image_token_id=image_token_id
